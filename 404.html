<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Idly Express</title>
    <meta name="description" content="The page you are looking for does not exist. Return to Idly Express home." />
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <script type="module" src="/src/main.js"></script>
</head>

<body class="bg-cream text-brown antialiased selection:bg-green selection:text-white flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 transition-all duration-300 bg-cream/95 backdrop-blur-md shadow-md" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="flex items-center gap-3 font-serif text-2xl font-bold tracking-tight text-brown">
                        <img src="/logo.png" alt="Idly Express Logo" class="h-12 w-auto">
                        <span>Idly<span class="text-green">Express</span></span>
                    </a>
                </div>
                <div class="md:hidden flex items-center">
                    <a href="/" class="text-brown hover:text-green font-semibold font-serif">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center pt-28 pb-20 px-4">
        <div class="max-w-2xl mx-auto text-center">
            <h1 class="text-9xl font-serif font-bold text-green/20 mb-4 select-none">404</h1>
            <h2 class="text-4xl font-serif font-bold text-brown mb-6 -mt-16 relative z-10">Oops! Page Not Found</h2>
            <p class="text-xl text-brown/80 mb-8 max-w-lg mx-auto">
                The page you are looking for might have been removed, had its name changed, or is temporarily
                unavailable.
            </p>
            <a href="/"
                class="inline-flex items-center bg-green text-white px-8 py-3 rounded-full font-bold hover:bg-lightGreen transition-transform hover:scale-105 shadow-lg gap-2 group">
                <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Home</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brown text-white py-12 border-t border-white/10">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-white/40 text-sm">&copy; 2026 Idly Express. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
